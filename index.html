<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Choose — 7 Brew Menu Builder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #fff;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      background: #120000;
      border-bottom: 2px solid #C8102E;
      padding: 13px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -1px;
      color: #fff;
    }
    .logo .seven { color: #C8102E; }
    .logo .choose { color: #F5C518; }
    .logo-sub {
      font-size: 0.65rem;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: -2px;
    }
    .nav-tabs { display: flex; gap: 8px; }
    .nav-tab {
      background: transparent;
      border: 1px solid #333;
      color: #777;
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.15s;
    }
    .nav-tab.active {
      background: #C8102E;
      border-color: #C8102E;
      color: #fff;
    }

    /* ── LAYOUT ── */
    .container { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }

    /* ── PROGRESS ── */
    .progress-wrap { margin-bottom: 18px; }
    .progress-bar { display: flex; gap: 4px; margin-bottom: 6px; }
    .progress-step { flex: 1; height: 4px; background: #252525; border-radius: 2px; transition: background 0.3s; }
    .progress-step.done { background: #C8102E; }
    .progress-step.active { background: #F5C518; }
    .progress-label { font-size: 0.72rem; color: #555; }

    /* ── STEP HEADER ── */
    .step-header { margin-bottom: 18px; }
    .step-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 3px; }
    .step-subtitle { color: #666; font-size: 0.88rem; }

    /* ── BACK BUTTON ── */
    .btn-back {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #666;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      margin-bottom: 14px;
      transition: all 0.15s;
    }
    .btn-back:hover { color: #fff; border-color: #555; }

    /* ── CARDS GRID ── */
    .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cards-grid.one-col { grid-template-columns: 1fr; }

    .card {
      background: #181818;
      border: 1px solid #242424;
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .card:hover { border-color: #C8102E; background: #1e0a0a; transform: translateY(-1px); }
    .card.selected { border-color: #C8102E; background: #260808; }

    .card-emoji { font-size: 1.9rem; margin-bottom: 6px; display: block; }
    .card-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 3px; }
    .card-desc { color: #666; font-size: 0.78rem; line-height: 1.4; }
    .card-price { color: #F5C518; font-size: 0.82rem; font-weight: 600; margin-top: 6px; }

    /* ── SIZE PICKER ── */
    .size-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .size-card {
      background: #181818;
      border: 2px solid #242424;
      border-radius: 12px;
      padding: 20px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .size-card:hover { border-color: #C8102E; }
    .size-card.selected { border-color: #C8102E; background: #260808; }
    .size-icon { margin-bottom: 5px; }
    .size-label { font-weight: 700; font-size: 1rem; }
    .size-oz { color: #555; font-size: 0.72rem; margin-top: 1px; }
    .size-price { color: #F5C518; font-weight: 700; font-size: 0.92rem; margin-top: 5px; }

    /* ── OPTION LIST (milk, temp, sweetness) ── */
    .option-list { display: flex; flex-direction: column; gap: 8px; }
    .option-item {
      background: #181818;
      border: 1px solid #242424;
      border-radius: 10px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s;
    }
    .option-item:hover { border-color: #C8102E; }
    .option-item.selected { border-color: #C8102E; background: #260808; }
    .option-left { display: flex; align-items: center; gap: 12px; }
    .option-emoji { font-size: 1.4rem; }
    .option-name { font-weight: 600; font-size: 0.92rem; }
    .option-note { color: #555; font-size: 0.75rem; margin-top: 1px; }
    .badge-gold {
      color: #F5C518; font-size: 0.78rem; font-weight: 700;
      background: #1e1900; padding: 3px 9px; border-radius: 10px; white-space: nowrap;
    }
    .badge-muted { color: #444; font-size: 0.78rem; }

    /* ── FLAVORS ── */
    .flavor-count-bar {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 0.82rem;
      color: #888;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .flavor-tag {
      background: #2a0808;
      color: #ff8080;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .flavor-tag.sf {
      background: #0a2010;
      color: #70c070;
    }
    .flavor-tag.combo {
      background: #1e1800;
      color: #F5C518;
    }

    .section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #555;
      font-weight: 700;
      margin: 14px 0 8px;
    }

    /* Signature combos */
    .combo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
    .combo-card {
      background: #181818;
      border: 1px solid #242424;
      border-radius: 10px;
      padding: 11px 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .combo-card:hover { border-color: #F5C518; background: #181500; }
    .combo-card.selected { border-color: #F5C518; background: #201d00; }
    .combo-name { font-weight: 700; font-size: 0.88rem; margin-bottom: 3px; }
    .combo-flavors { color: #F5C518; font-size: 0.73rem; }
    .combo-taste { color: #555; font-size: 0.7rem; margin-top: 2px; }

    /* Flavor chips */
    .flavor-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .flavor-chip {
      background: #181818;
      border: 1px solid #242424;
      border-radius: 8px;
      padding: 9px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 0.78rem;
      color: #ccc;
      line-height: 1.3;
    }
    .flavor-chip:hover { border-color: #C8102E; }
    .flavor-chip.selected { border-color: #C8102E; background: #260808; color: #ff8080; }
    .flavor-chip.sf { border-color: #1a2a1a; }
    .flavor-chip.sf:hover { border-color: #4CAF50; }
    .flavor-chip.sf.selected { border-color: #4CAF50; background: #0a200a; color: #70c070; }
    .flavor-chip .f-emoji { font-size: 1.2rem; display: block; margin-bottom: 2px; }

    /* ── ADD-ONS ── */
    .addon-item {
      background: #181818;
      border: 1px solid #242424;
      border-radius: 10px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 8px;
    }
    .addon-item:hover { border-color: #4CAF50; }
    .addon-item.selected { border-color: #4CAF50; background: #0a200a; }

    /* ── ORDER SUMMARY ── */
    .order-card {
      background: #181818;
      border: 1px solid #C8102E;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }
    .order-drink-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a2a;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 7px 0;
      border-bottom: 1px solid #1e1e1e;
      font-size: 0.88rem;
    }
    .summary-row:last-child { border-bottom: none; }
    .sum-label { color: #555; min-width: 80px; }
    .sum-value { font-weight: 600; text-align: right; color: #ddd; }
    .sum-price { font-size: 1.6rem; font-weight: 900; color: #F5C518; }

    /* ── BUTTONS ── */
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 10px;
      text-align: center;
    }
    .btn-red { background: #C8102E; color: #fff; }
    .btn-red:hover { background: #a50d26; }
    .btn-gold { background: #F5C518; color: #0d0d0d; }
    .btn-gold:hover { background: #d4a800; }
    .btn-ghost { background: transparent; border: 1px solid #2a2a2a; color: #666; }
    .btn-ghost:hover { border-color: #555; color: #aaa; }
    .btn-green { background: #1a3a1a; color: #70c070; border: 1px solid #4CAF50; }
    .btn-green:hover { background: #254a25; }

    /* ── FLAVORS CONTINUE ── */
    .flavor-actions { margin-top: 20px; }

    /* ── FAVORITES ── */
    .fav-card {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .fav-label-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .fav-label { color: #F5C518; font-weight: 800; font-size: 1rem; flex: 1; }
    .fav-edit-btn {
      background: transparent; border: none; cursor: pointer;
      font-size: 0.9rem; padding: 2px 4px; opacity: 0.5;
      transition: opacity 0.15s; flex-shrink: 0;
    }
    .fav-edit-btn:hover { opacity: 1; }
    .fav-rename-input {
      flex: 1; background: #0d0d0d; border: 1px solid #C8102E;
      color: #F5C518; font-weight: 800; font-size: 1rem;
      padding: 3px 8px; border-radius: 6px; outline: none; width: 100%;
    }
    .fav-detail { color: #666; font-size: 0.8rem; margin-bottom: 2px; line-height: 1.5; }
    .fav-detail strong { color: #999; }
    .fav-est { color: #C8102E; font-weight: 700; font-size: 0.92rem; margin-top: 10px; }
    .fav-saved { color: #444; font-size: 0.72rem; margin-top: 2px; }
    .fav-actions { display: flex; gap: 8px; margin-top: 12px; }
    .fav-btn {
      flex: 1; padding: 9px; border-radius: 8px; border: none;
      cursor: pointer; font-size: 0.8rem; font-weight: 700;
    }
    .fav-btn-reorder { background: #C8102E; color: #fff; }
    .fav-btn-reorder:hover { background: #a50d26; }
    .fav-btn-delete { background: #222; color: #555; }
    .fav-btn-delete:hover { color: #C8102E; }
    .fav-btn-share { background: #111827; color: #60a5fa; border: 1px solid #1d4ed8; }
    .fav-btn-share:hover { background: #1e3a5f; }

    /* ── NAME BADGE ── */
    .name-badge {
      display: inline-block;
      background: #111827; color: #60a5fa;
      border-radius: 10px; padding: 2px 9px;
      font-size: 0.72rem; font-weight: 700;
      margin-bottom: 4px;
    }

    /* ── HANDOFF SCREEN ── */
    .handoff-screen { text-align: center; padding: 40px 20px; }
    .handoff-check { font-size: 4rem; margin-bottom: 12px; }
    .handoff-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 6px; }
    .handoff-sub { color: #666; font-size: 0.88rem; margin-bottom: 28px; }
    .handoff-divider { border-top: 1px solid #2a2a2a; margin: 24px 0; position: relative; }
    .handoff-divider span {
      position: absolute; top: -10px; left: 50%;
      transform: translateX(-50%);
      background: #0d0d0d; padding: 0 12px;
      color: #444; font-size: 0.78rem;
    }

    /* ── GROUP BANNER ── */
    .group-banner {
      background: #111827; border: 1px solid #1d4ed8;
      border-radius: 10px; padding: 12px 16px;
      margin-bottom: 16px; display: flex;
      align-items: center; justify-content: space-between; gap: 10px;
    }
    .group-banner-title { color: #60a5fa; font-weight: 700; font-size: 0.88rem; }
    .group-banner-sub { color: #4b5563; font-size: 0.75rem; margin-top: 1px; }
    .group-banner-exit {
      background: none; border: none; color: #374151;
      cursor: pointer; font-size: 0.82rem; padding: 4px 8px;
      border-radius: 6px; transition: all 0.15s; white-space: nowrap;
    }
    .group-banner-exit:hover { background: #1f2937; color: #9ca3af; }

    /* ── PICKUP NOTE ── */
    .pickup-note-input {
      width: 100%; background: #111; border: 1px solid #2a2a2a;
      color: #aaa; padding: 11px 14px; border-radius: 8px;
      font-size: 0.85rem; outline: none; margin-bottom: 12px;
    }
    .pickup-note-input:focus { border-color: #555; }

    /* ── EMPTY STATE ── */
    .empty-state { text-align: center; padding: 70px 20px; color: #444; }
    .empty-icon { font-size: 3.5rem; margin-bottom: 14px; }
    .empty-title { font-size: 1rem; font-weight: 700; color: #555; margin-bottom: 6px; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a3a1a;
      border: 1px solid #4CAF50;
      color: #70c070;
      padding: 12px 22px;
      border-radius: 24px;
      font-weight: 700;
      font-size: 0.88rem;
      z-index: 300;
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 20px;
    }
    .modal {
      background: #181818;
      border: 1px solid #C8102E;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
    }
    .modal-title { font-weight: 800; font-size: 1.1rem; margin-bottom: 14px; }
    .modal input {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #333;
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 14px;
      outline: none;
    }
    .modal input:focus { border-color: #C8102E; }

    /* ── CART BADGE ── */
    .cart-badge {
      position: absolute; top: -4px; right: -6px;
      background: #F5C518; color: #0d0d0d;
      font-size: 0.65rem; font-weight: 900;
      border-radius: 10px; padding: 1px 5px;
      min-width: 16px; text-align: center;
    }

    /* ── CART ITEM ── */
    .cart-item {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .cart-item-num {
      background: #C8102E;
      color: #fff;
      font-weight: 900;
      font-size: 0.85rem;
      border-radius: 50%;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .cart-item-body { flex: 1; min-width: 0; }
    .cart-item-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .cart-item-detail { color: #666; font-size: 0.78rem; line-height: 1.6; }
    .cart-item-price { color: #F5C518; font-weight: 700; font-size: 0.88rem; margin-top: 6px; }
    .cart-item-del {
      background: transparent; border: none; color: #444;
      cursor: pointer; font-size: 1.1rem; padding: 2px 4px;
      flex-shrink: 0; transition: color 0.15s;
    }
    .cart-item-del:hover { color: #C8102E; }
    .cart-total {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-weight: 700;
    }
    .cart-total-label { color: #888; }
    .cart-total-price { font-size: 1.3rem; color: #F5C518; font-weight: 900; }

    /* ── ORDER READ-OFF BOX ── */
    .order-readoff {
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 14px 16px;
      font-family: monospace;
      font-size: 0.82rem;
      color: #ccc;
      white-space: pre-line;
      line-height: 1.9;
    }

    /* ── FLAVOR FILTER BAR ── */
    .filter-bar {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filter-pill {
      background: #181818;
      border: 1px solid #2a2a2a;
      color: #777;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-pill:hover { border-color: #555; color: #ccc; }
    .filter-pill.active { background: #C8102E; border-color: #C8102E; color: #fff; }

    /* ── MISC ── */
    .hidden { display: none !important; }
    .tag {
      display: inline-block;
      background: #1e1800; color: #F5C518;
      border-radius: 5px; padding: 2px 7px;
      font-size: 0.72rem; font-weight: 600; margin: 1px;
    }
    .price-note {
      text-align: center; color: #3a3a3a;
      font-size: 0.72rem; margin-top: -6px; margin-bottom: 12px;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0d0d0d; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }

    @media (max-width: 380px) {
      .cards-grid { grid-template-columns: 1fr; }
      .flavor-grid { grid-template-columns: repeat(2, 1fr); }
      .combo-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="logo"><span class="seven">7</span> <span class="choose">Choose</span></div>
    <div class="logo-sub">7 Brew Menu Builder</div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" id="tab-build" onclick="switchTab('build')">🍵 Build</button>
    <button class="nav-tab" id="tab-cart" onclick="switchTab('cart')" style="position:relative">
      🛒 Cart<span id="cart-badge" class="cart-badge hidden">0</span>
    </button>
    <button class="nav-tab" id="tab-favs" onclick="switchTab('favs')">❤️ Saved</button>
  </div>
</div>

<!-- BUILD VIEW -->
<div id="view-build">
  <div class="container">
    <div id="group-banner" class="group-banner hidden">
      <div>
        <div class="group-banner-title">👥 Group Order Mode</div>
        <div class="group-banner-sub" id="group-banner-sub">Build your drink, then submit to the collector</div>
      </div>
      <button class="group-banner-exit" onclick="exitGroupMode()">✕ Exit</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
      <div class="progress-label" id="progress-label"></div>
    </div>
    <button class="btn-back hidden" id="btn-back" onclick="goBack()">← Back</button>
    <div id="step-content"></div>
  </div>
</div>

<!-- CART VIEW -->
<div id="view-cart" class="hidden">
  <div class="container">
    <div class="step-header">
      <div class="step-title">🛒 Your Cart</div>
      <div class="step-subtitle" id="cart-subtitle">Build drinks then order together</div>
    </div>
    <div id="cart-list"></div>
  </div>
</div>

<!-- FAVORITES VIEW -->
<div id="view-favs" class="hidden">
  <div class="container">
    <div class="step-header">
      <div class="step-title">❤️ Saved Drinks</div>
      <div class="step-subtitle">Your favorite 7 Brew orders</div>
    </div>
    <div id="favs-list"></div>
  </div>
</div>

<!-- REORDER MODAL -->
<div class="modal-overlay hidden" id="reorder-modal">
  <div class="modal">
    <div class="modal-title">🔄 Reorder Details</div>
    <div id="reorder-content" style="color:#aaa;font-size:0.88rem;line-height:1.8;margin-bottom:16px;"></div>
    <button class="btn btn-ghost" onclick="document.getElementById('reorder-modal').classList.add('hidden')">Close</button>
  </div>
</div>

<!-- SAVE MODAL -->
<div class="modal-overlay hidden" id="save-modal">

// ===================== HELPERS =====================

// HTML-escape any string before injecting into innerHTML.
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// UTF-8-safe base64 (replaces deprecated escape/unescape).
function b64encode(obj) {
  const json = JSON.stringify(obj);
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64decode(str) {
  const bin = atob(str);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const json = new TextDecoder().decode(bytes);
  return JSON.parse(json);
}

// Make the click-only div "buttons" keyboard-operable (focusable + ARIA role).
const A11Y_SELECTOR = '.card,.size-card,.option-item,.combo-card,.flavor-chip,.addon-item';
function applyA11y() {
  document.querySelectorAll(A11Y_SELECTOR).forEach(el => {
    if (!el.hasAttribute('role'))     el.setAttribute('role', 'button');
    if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
  });
}
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') &&
      e.target.matches && e.target.matches(A11Y_SELECTOR)) {
    e.preventDefault();
    e.target.click();
  }
});

  temp: 'Prep', milk: 'Milk', flavors: 'Flavors',
  sweetness: 'Sweetness', addons: 'Extras', summary: 'Summary'
};

function getSteps() {
  const c = S.order.category;
  const steps = ['category', 'drink', 'size'];
  if (c && c.hasTemp)    steps.push('temp');
  if (c && c.hasMilk)    steps.push('milk');
  if (c && c.hasFlavors) steps.push('flavors');
  steps.push('sweetness', 'addons', 'summary');
  return steps;
}

function currentStepName() {
  return getSteps()[S.step];
}

// ===================== PRICE CALC =====================

function calcPrice() {
  const { category, drink, size, milk, addons } = S.order;
  if (!category || !drink || !size) return 0;
  const prices = drink.prices || category.prices;
  let total = prices[size] || 0;
  if (milk) {
    const m = DATA.milks.find(x => x.id === milk);
    if (m) total += m.cost;
  }
  for (const id of addons) {
    const a = DATA.addons.find(x => x.id === id);
    if (a) total += a.cost;
  }
  return total;
}

// ===================== RENDER =====================

function render() {
  const steps = getSteps();
  const stepName = steps[S.step];
  renderProgress(steps, S.step);
  document.getElementById('btn-back').classList.toggle('hidden', S.step === 0);
  const el = document.getElementById('step-content');
  el.innerHTML = RENDERERS[stepName]();
  applyA11y();
}

function renderProgress(steps, idx) {
  document.getElementById('progress-bar').innerHTML =
    steps.map((s, i) => `<div class="progress-step ${i < idx ? 'done' : i === idx ? 'active' : ''}"></div>`).join('');
  document.getElementById('progress-label').textContent =
    `Step ${idx + 1} of ${steps.length} · ${STEP_NAMES[steps[idx]] || ''}`;
}

// ===================== ACTIONS =====================

function pick(field, id) {
  const maps = {
    category: () => {
      const cat = DATA.categories.find(x => x.id === id);
      S.order = { category: cat, drink: null, size: null, temp: null, milk: null, flavors: [], combo: null, sweetness: null, addons: [] };
      S.flavorFilter = 'all';
    },
    drink: () => {
      const d = S.order.category.drinks.find(x => x.id === id);
      S.order.drink = d;
      S.order.flavors = d.defaults ? [...d.defaults] : [];
      S.order.combo = null;
    },
    size:      () => { S.order.size      = id; },
    temp:      () => { S.order.temp      = id; },
    milk:      () => { S.order.milk      = id; },
    sweetness: () => { S.order.sweetness = id; },
  };
  if (maps[field]) maps[field]();
  advance();
}

function advance() {
  const steps = getSteps();
  if (S.step < steps.length - 1) { S.step++; render(); }
}

function goBack() {
  if (S.step > 0) { S.step--; render(); }
}

function setFlavorFilter(id) {
  S.flavorFilter = id;
  // Switching to an individual flavor tab clears any active combo
  if (id !== 'combos' && id !== 'all' && S.order.combo) {
    S.order.combo = null;
    S.order.flavors = [];
  }
  render();
}

function toggleFlavor(name) {
  S.order.combo = null; // clear combo when manually picking
  const idx = S.order.flavors.indexOf(name);
  if (idx >= 0) {
    S.order.flavors.splice(idx, 1);
  } else {
    S.order.flavors.push(name);
  }
  render();
}

function toggleCombo(id) {
  const cb = DATA.combos.find(x => x.id === id);
  if (S.order.combo && S.order.combo.id === id) {
    S.order.combo = null;
    S.order.flavors = [];
  } else {
    S.order.combo = cb;
    S.order.flavors = [];
  }
  render();
}

function toggleAddon(id) {
  const idx = S.order.addons.indexOf(id);
  if (idx >= 0) S.order.addons.splice(idx, 1);
  else S.order.addons.push(id);
  render();
}

function startOver() {
  S.step = 0;
  S.flavorFilter = 'all';
  S.order = { category: null, drink: null, size: null, temp: null, milk: null, flavors: [], combo: null, sweetness: null, addons: [] };
  render();
}

// ===================== TABS =====================

function switchTab(tab) {
  S.tab = tab;
  document.getElementById('view-build').classList.toggle('hidden', tab !== 'build');
  document.getElementById('view-cart').classList.toggle('hidden', tab !== 'cart');
  document.getElementById('view-favs').classList.toggle('hidden', tab !== 'favs');
  document.getElementById('tab-build').classList.toggle('active', tab === 'build');
  document.getElementById('tab-cart').classList.toggle('active', tab === 'cart');
  document.getElementById('tab-favs').classList.toggle('active', tab === 'favs');
  if (tab === 'favs') renderFavs();
  if (tab === 'cart') renderCart();
}

// ===================== CART PERSISTENCE =====================

function saveCart() {
  try { localStorage.setItem('7choose_cart', JSON.stringify({ cart: S.cart, note: S.pickupNote })); }
  catch(e) {}
}
function loadCart() {
  try {
    const d = JSON.parse(localStorage.getItem('7choose_cart') || '{}');
    if (Array.isArray(d.cart)) S.cart = d.cart;
    if (d.note) S.pickupNote = d.note;
  } catch(e) {}
}

function loadFavs() {
  try { return JSON.parse(localStorage.getItem('7choose_favs') || '[]'); }
  catch { return []; }
}
function saveFavs(arr) {
  localStorage.setItem('7choose_favs', JSON.stringify(arr));
}

  }

    <div class="fav-card" id="fav-card-${i}">

      </div>

      ${f.milk ? `<div class="fav-detail"><strong>Milk:</strong> ${esc(f.milk)}</div>` : ''}

      </div>
    </div>
  `).join('');
}

function showReorder(idx) {
  const f = loadFavs()[idx];
  const lines = [
    `🍵 <strong>${esc(f.drink)}</strong>`,
    `📦 Size: ${esc(f.size)}`,
    f.temp      ? `🌡️ Prep: ${esc(f.temp)}` : null,
    f.milk      ? `🥛 Milk: ${esc(f.milk)}` : null,
    f.flavors   ? `🍶 Flavors: ${esc(f.flavors)}` : null,
    f.sweetness ? `🍯 Sweetness: ${esc(f.sweetness)}` : null,
    f.addons && f.addons.length ? `➕ Extras: ${esc(f.addons.join(', '))}` : null,
    `<br>💰 Est. ~$${(Number(f.price) || 0).toFixed(2)}`,
  ].filter(Boolean);
  document.getElementById('reorder-content').innerHTML = lines.join('<br>');
  document.getElementById('reorder-modal').classList.remove('hidden');
}

function startRename(idx) {
  const labelEl = document.getElementById(`fav-label-${idx}`);
  const editBtn = labelEl.nextElementSibling;
  const current = labelEl.textContent.trim();

  // Replace label with input
  const input = document.createElement('input');
  input.type = 'text';
  input.value = current;
  input.maxLength = 40;
  input.className = 'fav-rename-input';
  labelEl.replaceWith(input);
  editBtn.textContent = '✅';
  editBtn.onclick = () => saveFavName(idx, input, editBtn);
  input.focus();
  input.select();

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') saveFavName(idx, input, editBtn);
    if (e.key === 'Escape') cancelRename(idx, current, input, editBtn);
  });
  input.addEventListener('blur', () => {
    // Small delay so the ✅ click registers before blur fires
    setTimeout(() => { if (document.contains(input)) saveFavName(idx, input, editBtn); }, 150);
  });
}

function saveFavName(idx, input, editBtn) {
  if (!document.contains(input)) return; // already saved
  const newName = input.value.trim() || input.value;
  if (!newName) return;

  const favs = loadFavs();
  favs[idx].label = newName;
  saveFavs(favs);

  // Swap input back to label
  const newLabel = document.createElement('div');
  newLabel.className = 'fav-label';
  newLabel.id = `fav-label-${idx}`;
  newLabel.textContent = newName;
  input.replaceWith(newLabel);
  editBtn.textContent = '✏️';
  editBtn.onclick = () => startRename(idx);
  toast(`✅ Renamed to "${newName}"`);
}

function cancelRename(idx, original, input, editBtn) {
  const newLabel = document.createElement('div');
  newLabel.className = 'fav-label';
  newLabel.id = `fav-label-${idx}`;
  newLabel.textContent = original;
  input.replaceWith(newLabel);
  editBtn.textContent = '✏️';
  editBtn.onclick = () => startRename(idx);
}

function deleteFav(idx) {
  const favs = loadFavs();
  favs.splice(idx, 1);
  saveFavs(favs);
  renderFavs();
  toast('Removed from saved drinks');
}

function openSaveModal() {
  const modal = document.getElementById('save-modal');
  const input = document.getElementById('fav-name-input');
  modal.classList.remove('hidden');
  input.value = S.order.drink ? S.order.drink.name : '';
  setTimeout(() => input.focus(), 100);
}

function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}

function confirmSave() {
  const name = document.getElementById('fav-name-input').value.trim();
  if (!name) return;

  const { category: c, drink: d, size, temp, milk, flavors, combo, sweetness, addons } = S.order;
  const milkD   = milk      ? DATA.milks.find(x => x.id === milk) : null;

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ===================== CART =====================

function buildCartItem() {
  const { category: c, drink: d, size, temp, milk, flavors, combo, sweetness, addons } = S.order;
  const milkD   = milk      ? DATA.milks.find(x => x.id === milk)         : null;
  const tempD   = temp      ? DATA.temps.find(x => x.id === temp)          : null;
  const sweetD  = sweetness ? DATA.sweetness.find(x => x.id === sweetness) : null;
  const addonsD = addons.map(id => DATA.addons.find(x => x.id === id)).filter(Boolean);
  const sizeLabel = { S:'Small', M:'Medium', L:'Large' }[size] || size;

  let flavorTxt = '';
  if (combo) flavorTxt = `${combo.name}: ${combo.flavors.join(' + ')}`;
  else if (flavors.length) flavorTxt = flavors.join(' + ');

  return {
    drink:     d.name,
    category:  c.name,
    size:      sizeLabel,
    temp:      tempD   ? tempD.name   : null,
    milk:      milkD && milkD.id !== 'none' ? milkD.name : null,
    flavors:   flavorTxt || null,
    sweetness: sweetD  ? sweetD.name  : null,
    addons:    addonsD.map(a => a.name),
    price:     calcPrice(),
  };
}

function clearCart() {

  S.cart = [];
  saveCart();
  updateCartBadge();
  renderCart();
  toast('🗑️ Cart cleared');
}

function updateReadoff() {
  const box = document.getElementById('readoff-box');
  if (!box) return;
  const lines = S.cart.map((item, i) => {
    const parts = [`${item.size} ${item.drink}`];
    if (item.temp)      parts.push(item.temp);
    if (item.milk)      parts.push(item.milk);
    if (item.flavors)   parts.push(item.flavors);
    if (item.sweetness) parts.push(item.sweetness);
    if (item.addons && item.addons.length) parts.push(item.addons.join(', '));
    const prefix = item.forName ? `(${item.forName}) ` : '';
    return `${i + 1}. ${prefix}${parts.join(' · ')}`;
  });
  if (S.pickupNote) lines.push(`\n📍 ${S.pickupNote}`);
  box.textContent = lines.join('\n');

      <div style="color:#666;font-size:0.85rem;margin-top:4px">per person · ~$${total.toFixed(2)} total</div>

function venmoPerAmount() {
  const n = Math.max(1, parseInt(document.getElementById('venmo-people').value, 10) || 1);

}
function updateVenmoSplit() {
  document.getElementById('venmo-per').textContent = '$' + venmoPerAmount();
}
function venmoOpen(which) {
  const per = venmoPerAmount();
  const note = encodeURIComponent('7 Brew run');
  if (which === 'app') {
    window.location.href = `venmo://paycharge?txn=charge&amount=${per}&note=${note}`;
  } else {
    window.open(`https://venmo.com/?txn=charge&amount=${per}&note=${note}`, '_blank');
  }
}
function venmoCopy() {
  const per = venmoPerAmount();
  navigator.clipboard.writeText('$' + per).then(() => toast(`💸 $${per} copied!`)).catch(() => {});
  closeModal('share-modal');
}

//             "forName": { ".validate": "newData.isString() && newData.val().length < 40"  },

// }
//
// Note: room codes are 6 chars (~2 billion combos) so they aren't bulk-guessable,
// but a shared link is still a bearer token — anyone with the link can join.
// The client also HTML-escapes all order fields, so a malicious payload can't
// execute script in the collector's browser even if it reaches the database.

const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyBgrc0YNl0emWrLZeunm1MaHGsg7MV05-w",
  authDomain:        "brewchoose.firebaseapp.com",
  databaseURL:       "https://brewchoose-default-rtdb.firebaseio.com",
  projectId:         "brewchoose",
  storageBucket:     "brewchoose.firebasestorage.app",
  messagingSenderId: "862014629765",
  appId:             "1:862014629765:web:d9305a7a448cb0c70306ec",
};

let _db = null;

function firebaseReady() { return _db !== null; }

function initFirebase() {
  if (FIREBASE_CONFIG.databaseURL.includes('YOUR_PROJECT')) return;
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    _db = firebase.database();

    // Update submitter banner if already in group mode
    const bannerSub = document.getElementById('group-banner-sub');
    if (S.groupMode && S.groupRoomId && bannerSub) {
      bannerSub.textContent = `Room #${S.groupRoomId} · Build your drink and submit — it goes straight to the collector ⚡`;
    }

    // Reconnect collector room from previous session (up to 4 hrs)
    try {
      const d = JSON.parse(localStorage.getItem('7choose_room') || '{}');
      if (d.roomId && d.isCollector && (Date.now() - d.ts) < 4 * 3600000) {
        S.groupRoomId = d.roomId;
        S.isCollector = true;
        listenForOrders(d.roomId);
        toast(`⚡ Reconnected to Room #${d.roomId}`);
        if (S.tab === 'cart') renderCart();
      }
    } catch(e) {}
  } catch(e) { console.warn('Firebase init failed:', e); }
}

function pushDrinkToRoom(roomId, item) {
  if (!firebaseReady()) return false;
  try { _db.ref(`rooms/${roomId}/orders`).push(item); return true; }
  catch(e) { return false; }
}

// Persisted set of Firebase order keys we've already imported for a room, so
// clearing the cart and reconnecting doesn't re-add every past order.
function processedKeys(roomId) {
  try { return new Set(JSON.parse(localStorage.getItem('7choose_seen_' + roomId) || '[]')); }
  catch { return new Set(); }
}
function markProcessed(roomId, key) {
  const s = processedKeys(roomId);
  s.add(key);
  try { localStorage.setItem('7choose_seen_' + roomId, JSON.stringify([...s])); } catch(e) {}
}

function listenForOrders(roomId) {
  if (!firebaseReady()) return;
  // Seed dedup from persisted processed keys + anything currently in the cart.
  const seen = processedKeys(roomId);
  S.cart.filter(i => i._fbKey).forEach(i => seen.add(i._fbKey));
  _db.ref(`rooms/${roomId}/orders`).on('child_added', snap => {
    const key = snap.key;
    if (seen.has(key)) return; // already imported
    seen.add(key);
    markProcessed(roomId, key);
    const item = snap.val();
    item._fbKey = key;
    S.cart.push(item);
    saveCart();
    updateCartBadge();
    if (S.tab === 'cart') renderCart();
    toast(`🎉 ${item.forName ? item.forName + "'s" : 'A'} drink just came in!`);
  });
}

// ===================== GROUP ORDER ROOM =====================

function startGroupOrder() {
  const roomId = Math.random().toString(36).slice(2, 8).toUpperCase();
  S.groupRoomId = roomId;
  S.isCollector = true;
  const url = location.href.split('#')[0] + '#room=' + roomId;

  if (firebaseReady()) {
    _db.ref(`rooms/${roomId}/meta`).set({ created: Date.now() });
    listenForOrders(roomId);
    try { localStorage.setItem('7choose_room', JSON.stringify({ roomId, isCollector: true, ts: Date.now() })); } catch(e) {}
  }

  const live = firebaseReady();
  document.getElementById('share-modal-content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
      <span style="background:${live ? '#0a200a' : '#111827'};color:${live ? '#70c070' : '#60a5fa'};border-radius:20px;padding:4px 12px;font-size:0.75rem;font-weight:700">${live ? '⚡ Live Room' : '👥 Group Order Room'} #${roomId}</span>
      <button onclick="closeModal('share-modal')" style="background:none;border:none;color:#555;cursor:pointer;font-size:1.3rem;line-height:1">✕</button>
    </div>
    <div style="font-weight:800;font-size:1rem;margin-bottom:6px">Share this link with your crew</div>
    <div style="color:#666;font-size:0.82rem;margin-bottom:12px">${live
      ? "Each person opens it, builds their drink, and hits Submit. Their order appears in your cart automatically — no copy-paste needed."
      : "Each person opens it, builds their drink, then submits it back to you. You open each submission to add it to your cart."
    }</div>
    <div class="order-readoff" style="font-size:0.75rem;word-break:break-all;margin-bottom:14px;user-select:all">${url}</div>
    <button class="btn btn-gold" onclick="
      navigator.clipboard.writeText('${url}')
        .then(()=>toast('🔗 Room link copied! Share it in your group chat.'))
        .catch(()=>prompt('Copy this link:','${url}'));
    ">📋 Copy Room Link</button>
    <button class="btn btn-ghost" onclick="closeModal('share-modal')">${live ? "Done — watch your cart for orders ⚡" : "Done"}</button>
  `;
  document.getElementById('share-modal').classList.remove('hidden');
}

function checkRoomHash() {
  const hash = window.location.hash;
  if (!hash.startsWith('#room=')) return;
  const roomId = hash.slice(6).split('&')[0];
  S.groupMode = true;
  S.groupRoomId = roomId;
  document.getElementById('group-banner').classList.remove('hidden');
  document.getElementById('group-banner-sub').textContent = firebaseReady()
    ? `Room #${roomId} · Build your drink and submit — it goes straight to the collector ⚡`
    : `Room #${roomId} · Build your drink, then submit to the collector`;
}

function exitGroupMode() {
  S.groupMode = false;
  S.groupRoomId = null;
  document.getElementById('group-banner').classList.add('hidden');
  history.replaceState(null, '', location.pathname);
  render();
}

function promptGroupSubmit() {
  const input = document.getElementById('name-modal-input');
  document.getElementById('name-modal-title').textContent = '📤 What\'s your name?';
  const btn = document.getElementById('name-modal-confirm');
  btn.textContent = '📤 Submit to Group Order';
  btn.onclick = confirmGroupSubmit;
  input.value = S.nextBuilderName || '';
  document.getElementById('name-modal').classList.remove('hidden');
  setTimeout(() => input.focus(), 100);
}

function confirmGroupSubmit() {
  const name = document.getElementById('name-modal-input').value.trim() || 'Someone';
  closeModal('name-modal');
  const item = buildCartItem();
  item.forName = name;

  // Try Firebase live push first
  const pushedLive = pushDrinkToRoom(S.groupRoomId, item);

  if (pushedLive) {
    document.getElementById('share-modal-content').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <span style="background:#0a200a;color:#70c070;border-radius:20px;padding:4px 12px;font-size:0.75rem;font-weight:700">⚡ Submitted!</span>
        <button onclick="closeModal('share-modal')" style="background:none;border:none;color:#555;cursor:pointer;font-size:1.3rem;line-height:1">✕</button>
      </div>
      <div style="text-align:center;padding:8px 0 14px">
        <div style="font-size:3rem;margin-bottom:8px">✅</div>
        <div style="font-weight:800;font-size:1.1rem;margin-bottom:4px">${esc(name)}'s order is in!</div>
        <div style="color:#666;font-size:0.85rem">It went straight to the collector's cart. No copy-paste needed.</div>
      </div>
      <div style="background:#111;border-radius:8px;padding:12px;font-size:0.82rem;color:#aaa;text-align:center;margin-bottom:16px">
        ${esc(item.size)} ${esc(item.drink)}${item.temp ? ' · ' + esc(item.temp) : ''}${item.milk ? ' · ' + esc(item.milk) : ''}
      </div>
      <button class="btn btn-ghost" onclick="closeModal('share-modal')">Done 🎉</button>
    `;
    document.getElementById('share-modal').classList.remove('hidden');
    return;
  }

  // Fallback: URL hash method (no Firebase)
  const encoded = b64encode(item);
  const url = location.href.split('#')[0] + '#submit=' + encoded;
  document.getElementById('share-modal-content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
      <span style="background:#0a200a;color:#70c070;border-radius:20px;padding:4px 12px;font-size:0.75rem;font-weight:700">📤 Submission Ready</span>
      <button onclick="closeModal('share-modal')" style="background:none;border:none;color:#555;cursor:pointer;font-size:1.3rem;line-height:1">✕</button>
    </div>
    <div style="font-weight:800;font-size:1.1rem;margin-bottom:4px">${esc(name)}'s order is ready!</div>
    <div style="color:#666;font-size:0.82rem;margin-bottom:12px">Copy this link and send it to whoever is collecting orders.</div>
    <div class="order-readoff" style="font-size:0.72rem;word-break:break-all;margin-bottom:14px;user-select:all">${url}</div>
    <button class="btn btn-green" onclick="
      navigator.clipboard.writeText('${url}')
        .then(()=>toast('📤 Copied! Send it to the collector.'))
        .catch(()=>prompt('Send this to the collector:','${url}'));
    ">📋 Copy &amp; Send to Collector</button>
    <button class="btn btn-ghost" onclick="closeModal('share-modal')">Done</button>
  `;
  document.getElementById('share-modal').classList.remove('hidden');
}

function checkSubmitHash() {
  const hash = window.location.hash;
  if (!hash.startsWith('#submit=')) return;
  try {
    const item = b64decode(hash.slice(8));
    window._submittedItem = item;
    const lines = [
      item.size        ? `📦 ${esc(item.size)}` : null,
      item.temp        ? `🌡️ ${esc(item.temp)}` : null,
      item.milk        ? `🥛 ${esc(item.milk)}` : null,
      item.flavors     ? `🍶 ${esc(item.flavors)}` : null,
      item.sweetness   ? `🍯 ${esc(item.sweetness)}` : null,
      item.addons && item.addons.length ? `➕ ${esc(item.addons.join(', '))}` : null,
    ].filter(Boolean);
    document.getElementById('share-modal-content').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <span style="background:#0a200a;color:#70c070;border-radius:20px;padding:4px 12px;font-size:0.75rem;font-weight:700">📥 Order Submission</span>
        <button onclick="closeModal('share-modal');history.replaceState(null,'',location.pathname)"
          style="background:none;border:none;color:#555;cursor:pointer;font-size:1.3rem;line-height:1">✕</button>
      </div>
      <div style="font-size:1.15rem;font-weight:800;margin-bottom:2px">${item.forName ? esc(item.forName) + "'s order" : 'Submitted order'}</div>
      <div style="font-size:1rem;color:#ddd;margin-bottom:10px">${esc(item.drink)}</div>
      ${lines.map(l => `<div style="font-size:0.85rem;color:#aaa;margin-bottom:4px">${l}</div>`).join('')}
      <div style="color:#F5C518;font-weight:700;margin:12px 0 18px">Est. ~$${(Number(item.price)||0).toFixed(2)}</div>
      <button class="btn btn-green" onclick="addSubmittedToCart()">➕ Add to My Cart</button>
      <button class="btn btn-ghost" onclick="closeModal('share-modal');history.replaceState(null,'',location.pathname)">Dismiss</button>
    `;
    document.getElementById('share-modal').classList.remove('hidden');
    history.replaceState(null, '', location.pathname);
  } catch(e) { /* bad hash */ }
}

function addSubmittedToCart() {
  const item = window._submittedItem;
  if (!item) return;
  S.cart.push(item);
  saveCart();
  updateCartBadge();
  closeModal('share-modal');
  toast(`✅ ${item.forName ? item.forName + "'s" : 'Drink'} added to cart!`);
  switchTab('cart');
}

// ===================== FULL ORDER SHARE =====================

function shareFullCart() {
  if (!S.cart.length) { toast('Cart is empty'); return; }
  const payload = { type: 'order', items: S.cart, note: S.pickupNote };
  const encoded = b64encode(payload);
  const url = location.href.split('#')[0] + '#order=' + encoded;
  navigator.clipboard.writeText(url)
    .then(() => toast('📋 Full order link copied! Share with your group.'))
    .catch(() => prompt('Share this order link:', url));
}

function checkOrderHash() {
  const hash = window.location.hash;
  if (!hash.startsWith('#order=')) return;
  try {
    const payload = b64decode(hash.slice(7));
    const items = payload.items || [];
    const total = items.reduce((s, i) => s + (Number(i.price) || 0), 0);
    const lines = items.map((item, i) => {
      const parts = [`${esc(item.size)} ${esc(item.drink)}`];
      if (item.temp)      parts.push(esc(item.temp));
      if (item.milk)      parts.push(esc(item.milk));
      if (item.flavors)   parts.push(esc(item.flavors));
      if (item.sweetness) parts.push(esc(item.sweetness));
      if (item.addons && item.addons.length) parts.push(esc(item.addons.join(', ')));
      const prefix = item.forName ? `(${esc(item.forName)}) ` : '';
      return `${i+1}. ${prefix}${parts.join(' · ')}`;
    });
    if (payload.note) lines.push(`\n📍 ${esc(payload.note)}`);
    document.getElementById('share-modal-content').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <span style="background:#111827;color:#60a5fa;border-radius:20px;padding:4px 12px;font-size:0.75rem;font-weight:700">📋 Group Order</span>
        <button onclick="closeModal('share-modal');history.replaceState(null,'',location.pathname)"
          style="background:none;border:none;color:#555;cursor:pointer;font-size:1.3rem;line-height:1">✕</button>
      </div>
      <div style="font-weight:800;font-size:1rem;margin-bottom:12px">${items.length} drink${items.length !== 1 ? 's' : ''} · Est. ~$${total.toFixed(2)}</div>
      <div class="order-readoff">${lines.join('\n')}</div>
      <button class="btn btn-ghost" style="margin-top:12px"
        onclick="closeModal('share-modal');history.replaceState(null,'',location.pathname)">Close</button>
    `;
    document.getElementById('share-modal').classList.remove('hidden');
    history.replaceState(null, '', location.pathname);
  } catch(e) { /* bad hash */ }
}

// ===================== INIT =====================

function checkHashes() {
  const hash = window.location.hash;
  if      (hash.startsWith('#share='))  checkShareHash();
  else if (hash.startsWith('#submit=')) checkSubmitHash();
  else if (hash.startsWith('#order='))  checkOrderHash();
  else if (hash.startsWith('#room='))   checkRoomHash();
}

loadCart();
render();
checkHashes();
</script>

<script>initFirebase();</script>
